services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - stack.env
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
       sh -c "cd Flexingg &&
              python manage.py makemigrations --noinput &&
              python manage.py migrate --noinput &&
              gunicorn --bind 0.0.0.0:8000 --reload --reload-engine=poll Flexingg.wsgi:application"
    volumes:
      - .:/app
      - ./media:/app/Flexingg/media
    ports:
      - "1234:8000"
    env_file:
      - stack.env

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    command: >
      sh -c "cd Flexingg &&
             celery -A celery_app worker -l info"
    volumes:
      - .:/app
    env_file:
      - stack.env
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: >
      sh -c "cd Flexingg &&
             celery -A celery_app beat -l info"
    volumes:
      - .:/app
    env_file:
      - stack.env
    depends_on:
      - db
      - redis
volumes:
  postgres_data: