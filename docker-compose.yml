services:
  db:
    image: postgres:13
    container_name: flexingg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - stack.env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:6
    container_name: flexingg_redis
    volumes:
      - flexingg_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: flexingg_web
    command: >
      bash -c "
        python /app/Flexingg/manage.py makemigrations &&
        python /app/Flexingg/manage.py migrate &&
        python /app/Flexingg/manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 --reload Flexingg.wsgi:application
      "
    volumes:
      - .:/app
      - ./media:/app/Flexingg/media
    ports:
      - "1234:8000"
    env_file:
      - stack.env
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  celery:
    build: .
    container_name: flexingg_celery_worker
    command: celery -A flexingg worker -l info
    volumes:
      - .:/app
    env_file:
      - stack.env
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: flexingg_celery_beat
    command: celery -A flexingg beat -l info
    volumes:
      - .:/app
    env_file:
      - stack.env
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  flexingg_redis_data: