services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - stack.env
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --reload Flexingg.wsgi:application"
    volumes:
      - .:/app
      - ./media:/app/Flexingg/media
    ports:
      - "1234:8000"
    env_file:
      - stack.env
    working_dir: /app/Flexingg

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A celery_app worker -l info
    volumes:
      - .:/app
    env_file:
      - stack.env
    working_dir: /app/Flexingg
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A celery_app beat -l info
    volumes:
      - .:/app
    env_file:
      - stack.env
    working_dir: /app/Flexingg
    depends_on:
      - db
      - redis
volumes:
  postgres_data: