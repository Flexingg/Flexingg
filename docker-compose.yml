services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - stack.env
    ports:
      - "5432:5432"

  web:
    build: .
    working_dir: /app
    command: >
       sh -c "python Flexingg/manage.py makemigrations --noinput &&
              python Flexingg/manage.py migrate --noinput &&
              gunicorn --bind 0.0.0.0:8000 --reload --reload-engine=poll Flexingg.wsgi:application"
    # removed host bind mounts so the web service runs the code baked into the image
    ports:
      - "1234:8000"
    env_file:
      - stack.env

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    working_dir: /app
    command: >
      sh -c "celery -A Flexingg.celery_app worker -l info"
    # removed host bind mounts so celery runs code from the image
    env_file:
      - stack.env
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    working_dir: /app
    command: >
      sh -c "celery -A Flexingg.celery_app beat -l info"
    # removed host bind mounts so celery-beat runs code from the image
    env_file:
      - stack.env
    depends_on:
      - db
      - redis
volumes:
  postgres_data: