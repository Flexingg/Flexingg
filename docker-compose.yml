services:
  db:
    image: postgres:13
    container_name: flexingg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - stack.env
    ports:
      - "5433:5432"

  web:
    build: .
    container_name: flexingg_web
    command: gunicorn --bind 0.0.0.0:8000 --reload Flexingg.wsgi:application
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    volumes:
      - .:/app
      - ./media:/app/Flexingg/media
    ports:
      - "1234:8000"
    env_file:
      - stack.env
    working_dir: /app
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  redis:
    image: redis:6
    container_name: flexingg_redis
    volumes:
      - flexingg_redis_data:/data
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: flexingg_celery_worker
    command: celery -A flexingg worker -l info
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    volumes:
      - .:/app
    env_file:
      - stack.env
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: flexingg_celery_beat
    command: celery -A flexingg beat -l info
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    volumes:
      - .:/app
    env_file:
      - stack.env
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    depends_on:
      - db
      - redis
volumes:
  postgres_data:
  flexingg_redis_data: