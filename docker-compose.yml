services:
  db:
    image: postgres:13
    container_name: flexingg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - stack.env
    ports:
      - "5433:5432"

  redis:
    image: redis:6
    container_name: flexingg_redis
    volumes:
      - flexingg_redis_data:/data
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: flexingg_web
    command: >
      bash -c "
        echo 'Debug: Contents of /app'
        ls -la /app
        echo 'Debug: Contents of /app/Flexingg (if exists)'
        ls -la /app/Flexingg || echo 'Flexingg dir not found'
        python /app/Flexingg/manage.py makemigrations &&
        python /app/Flexingg/manage.py migrate &&
        python /app/Flexingg/manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 --reload Flexingg.wsgi:application
      "
    volumes:
      - .:/app
      - ./media:/app/Flexingg/media
    ports:
      - "1234:8000"
    env_file:
      - stack.env
    working_dir: /app
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  celery:
    build: .
    container_name: flexingg_celery_worker
    command: >
      bash -c '
        wait_for_port() {
          local port=$$1
          local host=$$2
          echo "Waiting for port $$port on $$host..."
          timeout=30
          while ! nc -z $$host $$port && [ $$timeout -gt 0 ]; do
            echo "Port $$port on $$host is still not available, waiting... ($$timeout seconds left)"
            sleep 1
            timeout=$$((timeout-1))
          done
          if [ $$timeout -eq 0 ]; then
            echo "Timeout waiting for port $$port on $$host"
            exit 1
          fi
        }
        wait_for_port 5432 db
        wait_for_port 6379 redis
        celery -A flexingg worker -l info
      '
    volumes:
      - .:/app
    env_file:
      - stack.env
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: flexingg_celery_beat
    command: >
      bash -c '
        wait_for_port() {
          local port=$$1
          local host=$$2
          echo "Waiting for port $$port on $$host..."
          timeout=30
          while ! nc -z $$host $$port && [ $$timeout -gt 0 ]; do
            echo "Port $$port on $$host is still not available, waiting... ($$timeout seconds left)"
            sleep 1
            timeout=$$((timeout-1))
          done
          if [ $$timeout -eq 0 ]; then
            echo "Timeout waiting for port $$port on $$host"
            exit 1
          fi
        }
        wait_for_port 5432 db
        wait_for_port 6379 redis
        celery -A flexingg beat -l info
      '
    volumes:
      - .:/app
    env_file:
      - stack.env
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  flexingg_redis_data: